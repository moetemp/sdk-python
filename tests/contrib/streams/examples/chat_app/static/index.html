<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Streams chat</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --line: #e4e7ec;
    --text: #1c2230;
    --muted: #6b7385;
    --faint: #9aa1b1;
    --accent: #4b47d6;
    --accent-soft: #ecebff;
    --wf: #7c3aed;
    --wf-soft: #f2eafe;
    --act: #0e7d72;
    --act-soft: #dcf6f2;
    --client: #a75a07;
    --client-soft: #fdf1dc;
    --red: #d1343a;
    --red-soft: #fde8e8;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    color: var(--text);
    background: var(--bg);
  }
  button {
    font: inherit;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 12px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: #c9ced8; background: #fafbfc; }
  button:disabled { color: var(--faint); cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { background: #3f3bc4; }
  button.primary:disabled { background: #b9b7ee; border-color: #b9b7ee; color: #fff; }
  input[type="text"], textarea {
    font: inherit;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 10px;
    background: var(--panel);
    outline: none;
  }
  input[type="text"]:focus, textarea:focus { border-color: var(--accent); }
  a { color: var(--accent); }

  .app {
    display: grid;
    grid-template-columns: 220px minmax(380px, 1fr) minmax(380px, 0.95fr);
    grid-template-rows: auto 1fr;
    height: 100vh;
  }
  header {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    min-height: 54px;
  }
  .brand { font-weight: 650; font-size: 15px; margin-right: 6px; }
  .brand span { color: var(--accent); }
  .chip {
    font-size: 12px;
    padding: 2px 9px;
    border-radius: 999px;
    background: #f0f1f4;
    color: var(--muted);
    white-space: nowrap;
  }
  .chip b { color: var(--text); font-weight: 600; }
  .chip.live { background: #e3f6e8; color: #17713a; }
  .chip.ended { background: #eef0f3; color: var(--muted); }
  .chip.failed { background: var(--red-soft); color: var(--red); }
  .spacer { flex: 1; }
  .header-actions { display: flex; gap: 8px; }

  aside {
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .side-head { padding: 14px 14px 10px; display: flex; flex-direction: column; gap: 8px; }
  .side-head .row { display: flex; gap: 6px; }
  .side-head input { flex: 1; min-width: 0; }
  .side-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--faint);
    padding: 8px 14px 4px;
    display: flex;
    justify-content: space-between;
  }
  .sessions { overflow-y: auto; padding: 0 8px 12px; }
  .sessions a {
    display: block;
    padding: 7px 10px;
    border-radius: 8px;
    color: var(--text);
    text-decoration: none;
    font-size: 13px;
  }
  .sessions a:hover { background: #f3f4f7; }
  .sessions a.current { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .sessions a small { display: block; color: var(--faint); font-size: 11px; font-weight: 400; }

  main { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .banner {
    margin: 12px 16px 0;
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 13px;
    display: none;
  }
  .banner.show { display: block; }
  .banner.info { background: var(--accent-soft); color: #3a37a8; }
  .banner.error { background: var(--red-soft); color: var(--red); }
  .messages { flex: 1; overflow-y: auto; padding: 18px 22px 8px; }
  .group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
  .slot { display: flex; flex-direction: column; gap: 6px; }
  .slot:empty { display: none; }
  .note {
    align-self: center;
    font-size: 12px;
    color: var(--muted);
    background: #eceef2;
    padding: 3px 11px;
    border-radius: 999px;
  }
  .bubble {
    max-width: 78%;
    padding: 9px 13px;
    border-radius: 14px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .bubble.user {
    align-self: flex-end;
    background: var(--accent);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .bubble.assistant {
    align-self: flex-start;
    background: var(--panel);
    border: 1px solid var(--line);
    border-bottom-left-radius: 4px;
  }
  .meta { font-size: 11px; color: var(--faint); }
  .slot.user-slot .meta { align-self: flex-end; }
  .draft::after {
    content: "";
    display: inline-block;
    width: 7px;
    height: 14px;
    margin-left: 2px;
    vertical-align: -2px;
    background: var(--accent);
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .bubble.error {
    align-self: flex-start;
    background: var(--red-soft);
    color: var(--red);
    border: 1px solid #f6c9cb;
  }
  .note.withdrawn, .bubble.withdrawn,
  .tok.withdrawn, .row.withdrawn .preview, .row.withdrawn .offset {
    text-decoration: line-through;
    text-decoration-color: var(--red);
    color: var(--red);
    opacity: .55;
  }
  .retry {
    display: inline-block;
    margin: 0 6px;
    padding: 0 7px;
    font-size: 11px;
    border-radius: 999px;
    background: var(--act-soft);
    color: var(--act);
    vertical-align: 1px;
    white-space: nowrap;
  }
  .welcome {
    margin: 12vh auto 0;
    max-width: 420px;
    text-align: center;
    color: var(--muted);
  }
  .welcome h2 { color: var(--text); font-size: 20px; margin: 0 0 6px; }
  .welcome .row { display: flex; gap: 8px; margin-top: 18px; }
  .welcome input { flex: 1; }

  .composer {
    border-top: 1px solid var(--line);
    background: var(--panel);
    padding: 12px 16px 10px;
  }
  .composer .row { display: flex; gap: 8px; align-items: flex-end; }
  .composer textarea { flex: 1; resize: none; height: 42px; max-height: 140px; }
  .composer .under {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
    font-size: 12px;
    color: var(--muted);
  }
  .toggle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
  }
  .toggle input { display: none; }
  .toggle .track {
    width: 30px;
    height: 17px;
    border-radius: 999px;
    background: #d6d9e0;
    position: relative;
    transition: background .15s;
  }
  .toggle .track::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #fff;
    transition: left .15s;
  }
  .toggle input:checked + .track { background: var(--red); }
  .toggle input:checked + .track::after { left: 15px; }

  .log-panel {
    background: var(--panel);
    border-left: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;
  }
  .log-head { padding: 12px 14px 8px; border-bottom: 1px solid var(--line); }
  .log-head h3 { margin: 0 0 8px; font-size: 13px; font-weight: 650; }
  .streams { display: flex; flex-direction: column; gap: 5px; }
  .stream-line { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .stream-line label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    min-width: 74px;
  }
  .stream-line .status { color: var(--muted); font-family: var(--mono); font-size: 11px; }
  .stream-line .sid {
    color: var(--faint);
    font-family: var(--mono);
    font-size: 11px;
    margin-left: auto;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .log { flex: 1; overflow-y: auto; font-family: var(--mono); font-size: 12px; }
  .row {
    padding: 6px 14px;
    border-bottom: 1px solid #f0f1f4;
    display: grid;
    grid-template-columns: 70px 66px 1fr;
    column-gap: 8px;
    align-items: baseline;
  }
  .row.fresh { animation: flash .8s ease-out; }
  @keyframes flash { from { background: #fff9db; } to { background: transparent; } }
  .row.superseded { background: #fff6f6; }
  .row.marker {
    display: block;
    text-align: center;
    color: var(--faint);
    font-size: 11px;
    background: #fafbfc;
  }
  .row .stream { font-weight: 600; }
  .row.turns .stream { color: var(--accent); }
  .row.tokens .stream { color: var(--act); }
  .row.lobby .stream { color: var(--client); }
  .row .offset { color: var(--muted); }
  .row .body { min-width: 0; }
  .row .line1 { display: flex; gap: 6px; align-items: baseline; min-width: 0; }
  .row .preview { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .row .copied { grid-column: 3; color: var(--accent); font-size: 11px; }
  .row .pid {
    grid-column: 3;
    color: var(--faint);
    font-size: 11px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .badge { font-size: 10.5px; padding: 0 6px; border-radius: 4px; white-space: nowrap; }
  .badge.kind-record { background: #eef0f3; color: var(--muted); }
  .badge.kind-superseded { background: var(--red-soft); color: var(--red); font-weight: 600; }
  .badge.p-workflow, .badge.p-local-activity { background: var(--wf-soft); color: var(--wf); }
  .badge.p-activity { background: var(--act-soft); color: var(--act); }
  .badge.p-client { background: var(--client-soft); color: var(--client); }
  .badge.p-unknown { background: #eef0f3; color: var(--muted); }
  .hide-turns .row.turns, .hide-tokens .row.tokens, .hide-lobby .row.lobby,
  .hide-sub .row.sub-turns, .hide-sub .row.sub-tokens { display: none; }
  .row.sub-turns .stream, .row.sub-tokens .stream { color: var(--wf); }

  .scenarios {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    padding: 9px 16px 0;
    font-size: 12px;
    color: var(--muted);
  }
  .scenarios button { font-size: 12px; padding: 3px 10px; border-radius: 999px; }
  .scenarios .now { flex-basis: 100%; color: var(--accent); min-height: 16px; }
  .flow { display: flex; flex-direction: column; gap: 8px; }
  .round { display: flex; flex-direction: column; gap: 3px; align-self: flex-start; }
  .round .bubble { max-width: 100%; }
  .round { max-width: 78%; }
  .round-label { font-size: 10.5px; color: var(--faint); }
  .round-label b { color: var(--accent); font-weight: 600; }
  .card {
    align-self: flex-start;
    max-width: 78%;
    min-width: 300px;
    border: 1px solid var(--line);
    border-left: 3px solid var(--act);
    background: var(--panel);
    border-radius: 10px;
    padding: 7px 11px;
    font-size: 13px;
  }
  .card .head { font-family: var(--mono); font-size: 12px; color: var(--act); }
  .card .line { font-size: 12px; color: var(--muted); }
  .card .line .off { font-family: var(--mono); color: var(--faint); }
  .card .result { margin-top: 3px; white-space: pre-wrap; }
  .card.research { border-left-color: var(--wf); }
  .card.research .head { color: var(--wf); }
  .panel {
    margin-top: 8px;
    border: 1px dashed #d8cff7;
    border-radius: 10px;
    padding: 8px;
    background: #fbfaff;
  }
  .panel-head { font-size: 11.5px; color: var(--wf); margin-bottom: 6px; }
  .panel .bubble, .panel .card, .panel .round { max-width: 100%; font-size: 12.5px; }
  .panel .card { min-width: 0; }
  .legend {
    border-top: 1px solid var(--line);
    padding: 8px 14px 10px;
    font-size: 11.5px;
    color: var(--muted);
    display: flex;
    flex-wrap: wrap;
    gap: 6px 12px;
  }
  .legend .badge { font-family: var(--mono); }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">Temporal <span>Streams</span> chat</div>
    <span class="chip" id="session-chip" hidden></span>
    <span class="chip" id="status-chip" hidden></span>
    <span class="chip" id="backend-chip" hidden></span>
    <span class="chip" id="provider-chip" hidden></span>
    <span class="chip" id="model-chip" hidden></span>
    <div class="spacer"></div>
    <div class="header-actions">
      <a id="second-reader" target="_blank" rel="noopener" hidden>
        <button>Open a second reader</button>
      </a>
      <button id="share" hidden>Share a snapshot</button>
      <button id="end" hidden>End chat</button>
    </div>
  </header>

  <aside>
    <div class="side-head">
      <button class="primary" id="new-chat">New chat</button>
      <div class="row">
        <input type="text" id="open-name" placeholder="Chat name" spellcheck="false">
        <button id="open">Open</button>
      </div>
    </div>
    <div class="side-title">
      <span>Chats</span><span title="The lobby Stream, read with last=20">lobby</span>
    </div>
    <nav class="sessions" id="sessions"></nav>
  </aside>

  <main>
    <div class="banner info" id="info"></div>
    <div class="banner error" id="error"></div>
    <div class="messages" id="messages"></div>
    <div class="scenarios" id="scenarios" hidden></div>
    <div class="composer" id="composer" hidden>
      <div class="row">
        <textarea id="text" placeholder="Send a message" rows="1"></textarea>
        <button class="primary" id="send">Send</button>
      </div>
      <div class="under">
        <label class="toggle" title="The model Activity fails partway through its first attempt">
          <input type="checkbox" id="fail"><span class="track"></span>
          Fail the first attempt of the next reply
        </label>
        <span id="sent"></span>
      </div>
    </div>
  </main>

  <section class="log-panel">
    <div class="log-head">
      <h3>Stream log</h3>
      <div class="streams">
        <div class="stream-line">
          <label><input type="checkbox" data-stream="turns" checked> turns</label>
          <span class="status" id="status-turns">not open</span>
          <span class="sid" id="sid-turns"></span>
        </div>
        <div class="stream-line">
          <label><input type="checkbox" data-stream="tokens" checked> tokens</label>
          <span class="status" id="status-tokens">not open</span>
          <span class="sid" id="sid-tokens"></span>
        </div>
        <div class="stream-line">
          <label><input type="checkbox" data-stream="sub" checked> sub-agent</label>
          <span class="status" id="status-sub">not open</span>
          <span class="sid">its own Streams</span>
        </div>
        <div class="stream-line">
          <label><input type="checkbox" data-stream="lobby"> lobby</label>
          <span class="status" id="status-lobby">not open</span>
          <span class="sid">streams-chat-app-lobby</span>
        </div>
      </div>
    </div>
    <div class="log hide-lobby" id="log"></div>
    <div class="legend">
      <span><span class="badge p-local-activity">local activity</span> the Workflow's writes</span>
      <span><span class="badge p-activity">activity #n</span> a model or tool attempt</span>
      <span><span class="badge p-client">client</span> the server</span>
      <span><span class="badge kind-superseded">superseded</span> withdraws a failed attempt</span>
    </div>
  </section>
</div>

<script>
"use strict";

const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
};
// Offsets are long and sparse, so the page shows their last digits and the full value on hover.
const shortOffset = (offset) => "…" + String(offset).slice(-6);
const producerKey = (producer) => JSON.stringify(producer ? producer.wire : null);
const roundKey = (number, round) => `${number}:${round}`;

const sessionId = new URLSearchParams(location.search).get("session");
const shareId = (location.pathname.match(/^\/share\/([^/]+)$/) || [])[1] || null;

// Each tab keeps its own place in each Stream. A reload of the tab resumes from it, and a new
// tab starts fresh as a second reader.
const storeKey = sessionId ? `streams-chat:${sessionId}` : null;
const saved = (storeKey && JSON.parse(sessionStorage.getItem(storeKey) || "null")) || {
  offsets: {},
  items: [],
};
let saving = true;
let ended = false;

const log = $("log");

function save() {
  if (!storeKey || !saving) return;
  try {
    sessionStorage.setItem(storeKey, JSON.stringify(saved));
  } catch (err) {
    saving = false;
    marker("This tab's storage is full, so it stopped saving its place");
  }
}

function stickToBottom(box, change) {
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  const result = change();
  if (atBottom) box.scrollTop = box.scrollHeight;
  return result;
}

// ---- The log panel ----

function marker(text) {
  stickToBottom(log, () => log.appendChild(el("div", "row marker", text)));
}

function preview(item) {
  if (item.kind === "superseded") return "";
  const data = item.data;
  if (item.stream.endsWith("tokens")) {
    return `#${data.number}.${data.round}  ${JSON.stringify(data.text)}`;
  }
  if (item.stream === "lobby") return `${data.session_id}  started ${data.started}`;
  const where = data.round ? `#${data.number}.${data.round}  ` : "";
  return `${where}${data.role}  ${data.text}`;
}

function logRow(item, fresh) {
  const row = el("div", `row ${item.stream} ${item.kind}`);
  if (fresh) row.classList.add("fresh");
  row.appendChild(el("span", "stream", item.stream));
  const offset = el("span", "offset", shortOffset(item.offset));
  offset.title = `offset ${item.offset}`;
  row.appendChild(offset);
  const body = el("div", "body");
  const line1 = el("div", "line1");
  line1.appendChild(el("span", `badge kind-${item.kind}`, item.kind));
  const p = item.producer;
  if (p) {
    const label = p.attempt ? `${p.kind} #${p.attempt}` : p.kind;
    line1.appendChild(el("span", `badge p-${p.kind.replace(" ", "-")}`, label));
  }
  const text = el("span", "preview", preview(item));
  text.title = text.textContent;
  line1.appendChild(text);
  body.appendChild(line1);
  const pid = el("div", "pid", p ? p.id : "");
  pid.title = p ? `Producer ${p.id}` : "";
  body.appendChild(pid);
  if (item.source) {
    const from = item.source.producer;
    const label = from ? ` (${from.kind}${from.attempt ? ` #${from.attempt}` : ""})` : "";
    const where = `copied from offset ${shortOffset(item.source.offset)}${label}`;
    const copied = el("div", "copied", where);
    copied.title = `chat offset ${item.source.offset}` + (from ? `, Producer ${from.id}` : "");
    body.appendChild(copied);
  }
  row.appendChild(body);
  return stickToBottom(log, () => log.appendChild(row));
}

// ---- A chat view, for the chat and for each sub-agent panel ----

class View {
  constructor(container, scroller) {
    this.container = container;
    this.scroller = scroller;
    this.groups = new Map(); // turn number to its place in the view
    this.rounds = new Map(); // "number:round" to the round's bubble
    this.cards = new Map(); // tool call id to its card
    this.finals = new Set(); // "number:round" of each round that has its Turn
    this.records = { turns: [], tokens: [] }; // each Record with its log row and node
    this.withdrawn = new Set(); // "stream:offset" of each withdrawn Record
    this.seen = new Set();
    this.rows = new Map();
  }

  group(number) {
    let g = this.groups.get(number);
    if (g) return g;
    g = { el: el("div", "group"), flow: el("div", "flow") };
    g.el.appendChild(g.flow);
    const later = [...this.groups.keys()].filter((n) => n > number).sort((a, b) => a - b)[0];
    this.container.insertBefore(g.el, later === undefined ? null : this.groups.get(later).el);
    this.groups.set(number, g);
    return g;
  }

  // A round's bubble goes after the cards of the rounds before it, also when its tokens come
  // before the last tool's result.
  round(number, round) {
    const key = roundKey(number, round);
    let r = this.rounds.get(key);
    if (r) return r;
    const g = this.group(number);
    r = { el: el("div", "round"), label: el("div", "round-label"), withdrawn: 0 };
    r.bubble = el("div", "bubble assistant draft");
    r.meta = el("div", "meta");
    r.label.textContent = `round ${round}`;
    r.el.append(r.label, r.bubble, r.meta);
    r.el.dataset.round = round;
    const after = [...g.flow.children].find((c) => Number(c.dataset.round || 0) > round);
    g.flow.insertBefore(r.el, after || null);
    this.rounds.set(key, r);
    return r;
  }

  showWithdrawn(r) {
    r.meta.textContent = r.withdrawn
      ? `A retry withdrew ${r.withdrawn} tokens of a failed attempt`
      : "";
  }

  card(turn) {
    let card = this.cards.get(turn.call_id);
    if (card) return card;
    card = el("div", `card ${turn.tool}`);
    card.dataset.round = turn.round;
    card.head = el("div", "head", turn.role === "tool_call" ? turn.text : turn.tool);
    card.lines = el("div");
    card.append(card.head, card.lines);
    this.group(turn.number).flow.appendChild(card);
    this.cards.set(turn.call_id, card);
    return card;
  }

  applyTurn(item) {
    const turn = item.data;
    return stickToBottom(this.scroller, () => {
      const g = this.group(turn.number);
      if (turn.role === "system") return g.flow.appendChild(el("div", "note", turn.text));
      if (turn.role === "user") {
        const bubble = el("div", "bubble user", turn.text);
        const offset = item.source ? item.source.offset : item.offset;
        const label = item.source ? "chat offset" : "offset";
        const meta = el("div", "meta", `${label} ${shortOffset(offset)}`);
        meta.title = `offset ${offset}`;
        const box = el("div", "slot user-slot");
        box.append(bubble, meta);
        g.flow.appendChild(box);
        return bubble;
      }
      if (turn.role === "assistant") {
        // A stored Turn keeps the count of what a retry withdrew, since the tab no longer
        // keeps that round's tokens.
        const r = this.round(turn.number, turn.round);
        this.finals.add(roundKey(turn.number, turn.round));
        r.withdrawn = Math.max(r.withdrawn, item.withdrawn || 0);
        r.bubble.className = "bubble assistant";
        r.bubble.textContent = turn.text || "(no text, only tool calls)";
        r.label.replaceChildren(`round ${turn.round}`);
        if (turn.final) r.label.append(" ", el("b", null, "answer"));
        this.showWithdrawn(r);
        return r.bubble;
      }
      if (turn.role === "error") {
        this.finals.add(roundKey(turn.number, turn.round));
        const r = this.rounds.get(roundKey(turn.number, turn.round));
        if (r) r.el.remove();
        return g.flow.appendChild(el("div", "bubble error", turn.text));
      }
      // A tool's Turns go to its card, so the card shows them in the order they came.
      const card = this.card(turn);
      if (turn.role === "agent") {
        openAgent(card, turn);
      } else if (turn.role === "tool_result") {
        card.lines.appendChild(el("div", "result", turn.text));
      } else if (turn.role !== "tool_call") {
        const line = el("div", "line", `${turn.text} `);
        line.appendChild(el("span", "off", shortOffset(item.offset)));
        card.lines.appendChild(line);
      }
      return card;
    });
  }

  applyToken(item) {
    const token = item.data;
    if (this.finals.has(roundKey(token.number, token.round))) return null;
    return stickToBottom(this.scroller, () =>
      this.round(token.number, token.round).bubble.appendChild(el("span", "tok", token.text))
    );
  }

  withdraw(item, base) {
    const offsets = new Set(item.withdrawn_offsets);
    const keys = new Set(item.withdrawn_keys || []);
    const perRound = new Map();
    let byOffset = 0;
    let byProducer = 0;
    for (const entry of this.records[base]) {
      const record = entry.item;
      const key = `${base}:${record.offset}`;
      if (this.withdrawn.has(key)) continue;
      if (offsets.has(record.offset)) byOffset += 1;
      else if (keys.has(producerKey(record.producer))) byProducer += 1;
      else continue;
      this.withdrawn.add(key);
      entry.row.classList.add("withdrawn");
      if (entry.node) entry.node.classList.add("withdrawn");
      const rk = roundKey(record.data.number, record.data.round);
      perRound.set(rk, (perRound.get(rk) || 0) + 1);
    }
    // Records that this read gave come in withdrawn_offsets. The server checks the Records that
    // the tab kept from an earlier read, before a reload or a reconnect, with withdraws().
    const row = this.rows.get(`${item.stream}:superseded:${item.offset}`);
    const text = row.querySelector(".preview");
    text.textContent = `withdraws ${byOffset + byProducer} Records`;
    if (byProducer) {
      text.textContent += `, ${byProducer} of them from an earlier read, by withdraws()`;
    }
    text.title = text.textContent;
    if (base !== "tokens") return;
    for (const [rk, count] of perRound) {
      [item.number, item.round] = rk.split(":").map(Number);
      const r = this.rounds.get(rk);
      if (!r) continue;
      r.withdrawn += count;
      if (r.bubble.classList.contains("draft")) {
        const attempt = item.producer && item.producer.attempt;
        r.bubble.appendChild(el("span", "retry", attempt ? `retry, attempt ${attempt}` : "retry"));
      }
      this.showWithdrawn(r);
    }
  }
}

const main = new View($("messages"), $("messages"));

// ---- Items from the Streams ----

const openTurns = new Set(); // turn numbers that have no answer or failure yet
// Offsets that a send returned before the page got their user Turn, which count as open turns.
const awaited = new Set();
const busy = () => openTurns.size > 0 || awaited.size > 0;
const turnWatchers = []; // callbacks of a running scenario

function handle(view, item, fresh) {
  if (item.kind === "record" && item.data.turn) {
    // A snapshot's Record is a copy. It names where its Turn was in the chat's turns Stream.
    item.source = { offset: item.data.source_offset, producer: item.data.source_producer };
    item.data = item.data.turn;
  }
  const key = `${item.stream}:${item.kind}:${item.offset}`;
  if (view.seen.has(key)) return; // a resume can give the last item again
  view.seen.add(key);
  view.rows.set(key, logRow(item, fresh));
  if (item.stream === "lobby") return addSession(item);
  const base = item.stream.replace("sub-", "");
  if (fresh && item.kind === "superseded") {
    item.withdrawn_keys = (item.withdrawn_kept || []).map((i) => keptKeys[i]);
  }
  if (item.kind === "superseded") {
    view.withdraw(item, base);
  } else {
    const node = base === "turns" ? view.applyTurn(item) : view.applyToken(item);
    view.records[base].push({ item, row: view.rows.get(key), node });
  }
  if (view !== main || item.kind !== "record" || base !== "turns") {
    return keep(view, item, fresh, base);
  }
  const turn = item.data;
  awaited.delete(item.offset);
  if (turn.role === "user" && turn.number) openTurns.add(turn.number);
  if (turn.final || turn.role === "error") openTurns.delete(turn.number);
  showComposer();
  if (fresh) turnWatchers.forEach((watch) => watch(turn));
  keep(view, item, fresh, base);
}

function keep(view, item, fresh, base) {
  if (!fresh || !storeKey || view !== main || item.stream === "lobby") return;
  if (item.next_offset) saved.offsets[item.stream] = item.next_offset;
  const data = item.data || {};
  const rk = roundKey(item.kind === "record" ? data.number : item.number, data.round || item.round);
  if (base === "turns" && (data.role === "assistant" || data.role === "error")) {
    // A round's tokens matter only until its Turn comes, so the tab stops keeping them.
    const r = view.rounds.get(rk);
    item.withdrawn = r ? r.withdrawn : 0;
    saved.items = saved.items.filter(
      (i) => i.stream !== "tokens" || roundKey(i.data ? i.data.number : i.number,
        i.data ? i.data.round : i.round) !== rk
    );
    saved.items.push(item);
  } else if (base === "turns" || !view.finals.has(rk)) {
    saved.items.push(item);
  }
  save();
}

function setStatus(stream, text) {
  const node = $(`status-${stream.replace(/^sub-.*/, "sub")}`);
  if (node) node.textContent = text;
}

// Each connection carries several reads. The page reconnects itself, so each new connection
// sends the offsets and the kept Producers of that moment. It closes the connection once the
// reads in `closeOn` end.
function connect(url, statuses, closeOn, view) {
  const source = new EventSource(url());
  const open = new Set(closeOn);
  for (const [stream, text] of Object.entries(statuses())) setStatus(stream, text);
  source.addEventListener("item", (e) => {
    const item = JSON.parse(e.data);
    setStatus(item.stream, "live");
    handle(view, item, true);
  });
  source.addEventListener("end", (e) => {
    const { stream } = JSON.parse(e.data);
    setStatus(stream, "closed, the read ended");
    if (stream === "turns" && !shareId && view === main) showEnded();
    open.delete(stream);
    if (closeOn.length && !open.size) source.close();
  });
  source.addEventListener("failed", (e) => {
    const failure = JSON.parse(e.data);
    setStatus(failure.stream, failure.error);
    showError(`The ${failure.stream} read failed with ${failure.error}. ${failure.message}`);
    if (closeOn.includes(failure.stream)) source.close();
  });
  source.onerror = () => {
    if (source.readyState === EventSource.CLOSED) {
      showError("The server refused an event stream");
      return;
    }
    source.close();
    for (const stream of Object.keys(statuses())) setStatus(stream, "reconnecting");
    setTimeout(() => {
      if (view === main) marker("reconnected, and resumed at the offsets that this tab saved");
      connect(url, statuses, closeOn, view);
    }, 2000);
  };
}

// A sub-agent's card opens a panel that reads the sub-agent's own Streams by their ids.
function openAgent(card, turn) {
  if (card.panel) return;
  const agent = turn.agent;
  card.panel = el("div", "panel");
  const head = el("div", "panel-head", `${turn.text}, in its own Streams `);
  head.appendChild(el("code", null, agent.turns.id));
  card.panel.appendChild(head);
  const flow = el("div");
  card.panel.appendChild(flow);
  card.lines.appendChild(card.panel);
  const view = new View(flow, $("messages"));
  const url = () => {
    const params = new URLSearchParams({ turns: agent.turns.id, tokens: agent.tokens.id });
    return `/api/agents/events?${params}`;
  };
  connect(url, () => ({ sub: "reading a sub-agent" }), ["sub-turns", "sub-tokens"], view);
}

const keptKeys = []; // the Producers that this tab sent with its current read

// The Producers of this tab's token Records whose round has no Turn yet. A retry can still
// withdraw those, and the server checks them against each Superseded item.
function keptProducers() {
  const open = new Map();
  for (const { item } of main.records.tokens) {
    const rk = roundKey(item.data.number, item.data.round);
    if (main.withdrawn.has(`tokens:${item.offset}`) || main.finals.has(rk)) continue;
    open.set(producerKey(item.producer), item.producer.wire);
  }
  keptKeys.length = 0;
  keptKeys.push(...open.keys());
  return [...open.values()];
}

// ---- Sessions ----

const sessionLinks = new Map();

function addSession(item) {
  const info = item.data;
  if (sessionLinks.has(info.session_id)) return;
  const link = el("a");
  link.href = `/?session=${encodeURIComponent(info.session_id)}`;
  link.textContent = info.session_id;
  link.appendChild(el("small", null, info.started.replace("T", " ").replace("+00:00", " UTC")));
  if (info.session_id === sessionId) link.classList.add("current");
  sessionLinks.set(info.session_id, link);
  $("sessions").prepend(link);
}

async function api(method, path, body) {
  const response = await fetch(path, {
    method,
    headers: { "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  let data = {};
  try {
    data = await response.json();
  } catch (err) {
    // A plain-text error, such as a crash in the server.
  }
  if (!response.ok) throw new Error(data.detail || `${response.status} ${response.statusText}`);
  return data;
}

async function openChat(name) {
  try {
    const opened = await api("POST", "/api/sessions", { session_id: name || null });
    location.href = `/?session=${encodeURIComponent(opened.session_id)}`;
  } catch (err) {
    showError(err.message);
  }
}

function showError(text) {
  $("error").textContent = text;
  $("error").classList.add("show");
}

function showInfo(text) {
  $("info").textContent = text;
  $("info").classList.add("show");
}

function chip(id, label, value, cls) {
  const node = $(id);
  node.replaceChildren(label ? `${label} ` : "");
  node.appendChild(el("b", null, value));
  node.className = `chip ${cls || ""}`;
  node.hidden = false;
}

function showEnded() {
  if (ended) return;
  ended = true;
  chip("status-chip", "", "ended", "ended");
  showInfo("This chat has ended. The session closed its Streams, so each read ended.");
  $("composer").hidden = true;
  $("scenarios").hidden = true;
  $("end").hidden = true;
}

// While a turn is in progress, a message joins its next round through the add_message Signal.
function showComposer() {
  $("send").textContent = busy() ? "Add to the turn" : "Send";
  $("text").placeholder = busy()
    ? "The agent is working. A message now joins its next round."
    : "Send a message";
}

function lobbyOnly() {
  connect(() => "/api/lobby", () => ({ lobby: "newest 20, with last=20" }), [], main);
}

async function startSession() {
  let opened;
  try {
    opened = await api("POST", "/api/sessions", { session_id: sessionId });
  } catch (err) {
    chip("status-chip", "", "failed", "failed");
    showError(err.message);
    lobbyOnly();
    return;
  }
  chip("session-chip", "", opened.session_id);
  chip("status-chip", "", opened.ended ? "ended" : "live", opened.ended ? "ended" : "live");
  chip("backend-chip", "backend", opened.backend);
  chip("provider-chip", "provider", opened.provider);
  chip("model-chip", "model", opened.model);
  $("sid-turns").textContent = opened.turns;
  $("sid-tokens").textContent = opened.tokens;
  $("second-reader").href = location.href;
  $("second-reader").hidden = false;
  $("share").hidden = false;
  $("composer").hidden = opened.ended;
  $("scenarios").hidden = opened.ended;
  $("end").hidden = opened.ended;
  buildScenarios();

  // Replay what this tab showed before a reload, in arrival order, so a resumed read adds to it.
  for (const item of saved.items) handle(main, item, false);
  if (saved.items.length) {
    marker(`restored ${saved.items.length} items from this tab, then resumed`);
  }

  const url = () => {
    const url = new URL(`/api/sessions/${sessionId}/events`, location.origin);
    if (saved.offsets.turns) url.searchParams.set("turns", saved.offsets.turns);
    if (saved.offsets.tokens) url.searchParams.set("tokens", saved.offsets.tokens);
    const kept = keptProducers();
    if (kept.length) url.searchParams.set("kept", JSON.stringify(kept));
    return url;
  };
  const statuses = () => ({
    lobby: "newest 20, with last=20",
    turns: saved.offsets.turns
      ? `resumed at ${shortOffset(saved.offsets.turns)}`
      : "from the start",
    tokens: saved.offsets.tokens
      ? `resumed at ${shortOffset(saved.offsets.tokens)}`
      : "new tokens only, from END",
  });
  connect(url, statuses, [], main);
}

async function startShare() {
  lobbyOnly();
  let info;
  try {
    info = await api("GET", `/api/shares/${shareId}`);
  } catch (err) {
    showError(err.message);
    return;
  }
  if (info.outdated) {
    chip("session-chip", "snapshot", info.share_id);
    showInfo("This snapshot was made by an older version of the app. Share the chat again.");
    return;
  }
  chip("session-chip", "snapshot of", info.session_id);
  chip("status-chip", "", "read only", "ended");
  $("sid-turns").textContent = info.share_id;
  setStatus("tokens", "not in a snapshot");
  showInfo(
    `This is a snapshot of ${info.session_id}, with its Turns before offset ` +
      `${shortOffset(info.upto)}. ` +
      "It's a new closed Stream that the server wrote, so its offsets and its Producer are " +
      "its own. Each row in the log also shows where its Turn was in the chat."
  );
  const url = () => `/api/shares/${shareId}/events`;
  connect(url, () => ({ turns: "from the start" }), ["turns"], main);
}

function showWelcome() {
  lobbyOnly();
  const box = el("div", "welcome");
  box.appendChild(el("h2", null, "Start a chat"));
  box.appendChild(el("div", null,
    "Each chat is a Workflow. Its agent answers in model rounds and tool calls, and writes " +
      "each step to its Streams."));
  const row = el("div", "row");
  const name = el("input");
  name.type = "text";
  name.placeholder = "Chat name, or leave empty";
  name.spellcheck = false;
  const go = el("button", "primary", "Start");
  go.onclick = () => openChat(name.value.trim());
  name.onkeydown = (e) => e.key === "Enter" && go.click();
  row.append(name, go);
  box.appendChild(row);
  $("messages").appendChild(box);
}

// ---- Controls ----

async function send(text, fail) {
  if (busy()) {
    await api("POST", `/api/sessions/${sessionId}/add`, { text });
    $("sent").textContent = "The add_message Signal published the message with publish_nowait";
    return;
  }
  const result = await api("POST", `/api/sessions/${sessionId}/messages`, {
    text,
    fail_first_attempt: fail,
  });
  if (!main.seen.has(`turns:record:${result.offset}`)) awaited.add(result.offset);
  showComposer();
  const offset = shortOffset(result.offset);
  $("sent").textContent = `The Update's awaited publish returned offset ${offset}`;
  $("sent").title = `offset ${result.offset}`;
}

async function sendMessage() {
  const text = $("text").value.trim();
  // A second Enter during a send would send the message twice.
  if (!text || $("send").disabled) return;
  $("send").disabled = true;
  try {
    await send(text, $("fail").checked);
    $("text").value = "";
    $("fail").checked = false;
  } catch (err) {
    showError(err.message);
  } finally {
    $("send").disabled = false;
    $("text").focus();
  }
}

async function shareSnapshot() {
  const shared = await api("POST", `/api/sessions/${sessionId}/share`);
  const info = $("info");
  info.replaceChildren("The snapshot is ready. ");
  const link = el("a", null, "Open the snapshot");
  link.href = shared.url;
  link.target = "_blank";
  link.rel = "noopener";
  info.appendChild(link);
  info.classList.add("show");
  return shared;
}

// ---- Scenarios ----

const SCENARIOS = [
  {
    name: "Tool rounds",
    shows: "three model rounds, with a tool call between each",
    steps: [{ say: "Roll two dice with roll_dice, then add them up with the calculator." }],
  },
  {
    name: "Parallel tools",
    shows: "two tool Activities that write to one Stream at the same time",
    steps: [
      {
        say:
          "Use the clock and the calculator at the same time. What time is it, and what is " +
          "12 * 34?",
      },
    ],
  },
  {
    name: "Failed attempt",
    shows: "a first attempt that fails, and a retry that withdraws its tokens",
    steps: [{ say: "Explain how a retry withdraws the tokens of a failed attempt.", fail: true }],
  },
  {
    name: "Message during a run",
    shows: "a message that joins the next round of the turn in progress",
    steps: [{ say: "Search the docs for retention.", add: "Also, how long do tokens stay?" }],
  },
  {
    name: "Sub-agent",
    shows: "a child Workflow that writes to Streams that it creates",
    steps: [{ say: "Use the research tool to look into continue-as-new." }],
  },
  {
    name: "Continue-as-new",
    shows: "seven rounds, then the next run takes over the same Streams",
    steps: [
      {
        say:
          "Roll one die at a time with roll_dice, six times in a row, and wait for each " +
          "result before the next roll. Then add them up.",
      },
    ],
  },
  { name: "Share", shows: "a snapshot, a new closed Stream", steps: [{ share: true }] },
];
SCENARIOS.push({
  name: "Run all",
  shows: "each case in one chat",
  steps: SCENARIOS.flatMap((s) => s.steps),
});

const pause = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

async function idle() {
  while (busy()) await pause(200);
}

function nextTurn(test) {
  return new Promise((resolve) => {
    const watch = (turn) => {
      if (!test(turn)) return;
      turnWatchers.splice(turnWatchers.indexOf(watch), 1);
      resolve(turn);
    };
    turnWatchers.push(watch);
  });
}

async function play(scenario, buttons) {
  buttons.forEach((b) => (b.disabled = true));
  const now = $("scenarios").querySelector(".now");
  try {
    for (const step of scenario.steps) {
      await idle();
      if (step.share) {
        now.textContent = "Sharing a snapshot";
        await shareSnapshot();
        continue;
      }
      now.textContent = `Sending "${step.say}"`;
      const toolCall = step.add ? nextTurn((t) => t.role === "tool_call") : null;
      await send(step.say, !!step.fail);
      if (toolCall) {
        await toolCall;
        now.textContent = `Adding "${step.add}" while the tool runs`;
        await send(step.add, false);
      }
      await idle();
    }
    now.textContent = `Done. The chat shows ${scenario.shows}.`;
  } catch (err) {
    showError(err.message);
  } finally {
    buttons.forEach((b) => (b.disabled = false));
  }
}

function buildScenarios() {
  const box = $("scenarios");
  box.replaceChildren(el("span", null, "Scenarios"));
  const buttons = SCENARIOS.map((s) => {
    const button = el("button", s.name === "Run all" ? "primary" : null, s.name);
    button.title = `Shows ${s.shows}`;
    button.onclick = () => play(s, buttons);
    return button;
  });
  box.append(...buttons, el("span", "now"));
}

$("send").onclick = sendMessage;
$("text").onkeydown = (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    sendMessage();
  }
};
$("end").onclick = async () => {
  $("end").disabled = true;
  try {
    await api("POST", `/api/sessions/${sessionId}/end`);
  } catch (err) {
    showError(err.message);
    $("end").disabled = false;
  }
};
$("share").onclick = async () => {
  try {
    await shareSnapshot();
  } catch (err) {
    showError(err.message);
  }
};
$("new-chat").onclick = () => openChat("");
$("open").onclick = () => openChat($("open-name").value.trim());
$("open-name").onkeydown = (e) => e.key === "Enter" && $("open").click();
for (const box of document.querySelectorAll("[data-stream]")) {
  box.onchange = () => log.classList.toggle(`hide-${box.dataset.stream}`, !box.checked);
}

if (shareId) startShare();
else if (sessionId) startSession();
else showWelcome();
</script>
</body>
